<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AGTF30 engine viewer (offline replay)</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f2f2ef;color:#161616}
header{background:#14213d;color:#fff;padding:10px 18px} header b{font-size:18px} header span{color:#c9d3e6;margin-left:12px;font-size:13px}
main{padding:14px 18px} #engine-canvas{width:100%;height:520px;display:block;border:1px solid #dcdcd6;border-radius:8px;background:#f6f7f8}
.bar{display:flex;gap:10px;align-items:center;margin:10px 0} button{font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid #c9c8c2;background:#fff;cursor:pointer}
button.go{background:#1baf7a;color:#fff;border-color:#138a5f} input[type=range]{flex:1} .muted{color:#666;font-size:12.5px}
</style></head><body>
<header><b>AGTF30 engine viewer</b><span>offline replay of a sea-level throttle burst (idle &rarr; max at t = 1 s, NASA baseline controller) &middot; schematic, not an engineering drawing</span></header>
<main>
<canvas id="engine-canvas"></canvas>
<div class="bar"><button class="go" id="play">&#9654; Play</button><button id="pause">&#10073;&#10073; Pause</button>
<input type="range" id="pos" min="0" max="140" value="0"><span id="time">t = 0.0 s</span>
<label class="muted"><input type="checkbox" id="labels" checked> labels</label></div>
<p class="muted">Recorded with the Turbofan Virtual Lab (twin/). For live experiments run <code>./run.sh app</code>. Rotation is shown about 30x slower than real.</p>
</main>
<script>/* Animated cutaway of the AGTF30 port for the virtual lab ("engine in action").
 * Pure HTML5 canvas 2D (no WebGL, no external libraries). The Python side pushes engine data with
 * window.LabEngine.update(d); this script animates at the display rate and eases between updates.
 * SCHEMATIC, NOT AN ENGINEERING DRAWING: proportions are illustrative; rotation is shown slowed down.
 */
(function () {
  "use strict";
  const S = { tgt: null, cur: null, ang: { fan: 0, lp: 0, hp: 0 }, parts: [], last: performance.now(), labels: true, flick: 0 };
  const NUMKEYS = ["N_fan", "N_LP", "N_HP", "Wf", "Fnet", "Fg_byp", "Fg_core", "W_in", "W_byp", "W_core", "W_vbv", "W5", "Tt2", "Tt21",
    "Tt25", "Tt3", "T4", "T45", "Tt5", "Ps3", "VAFN", "VBV", "SM_hpc", "SM_lpc", "SM_fan", "Nc_fan", "Nc_dem", "Pamb", "OPR", "BPR", "TSFC"];

  window.LabEngine = {
    update: function (d) {
      if (!d) return;
      S.tgt = d;
      if (!S.cur) { S.cur = JSON.parse(JSON.stringify(d)); }
      S.cur.running = d.running; S.cur.loop = d.loop; S.cur.mode = d.mode; S.cur.message = d.message; S.cur.health = d.health;
      S.cur.limits = d.limits; S.cur.t = d.t; S.cur.alt = d.alt; S.cur.mach = d.mach; S.cur.dT = d.dT; S.cur.power = d.power;
    },
    setLabels: function (on) { S.labels = !!on; }
  };

  // ---------- colours
  function tempColor(T, a) {           // deg R -> colour: cold blue, ambient pale, warm yellow, hot orange, very hot red
    const stops = [[380, [70, 120, 220]], [520, [150, 200, 240]], [800, [245, 235, 170]], [1300, [250, 190, 60]],
                   [2000, [240, 110, 30]], [2800, [210, 40, 20]], [3400, [150, 10, 30]]];
    if (T <= stops[0][0]) return "rgba(" + stops[0][1].join(",") + "," + a + ")";
    for (let i = 1; i < stops.length; i++) {
      if (T <= stops[i][0]) {
        const f = (T - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        const c = stops[i - 1][1].map((v, k) => Math.round(v + f * (stops[i][1][k] - v)));
        return "rgba(" + c.join(",") + "," + a + ")";
      }
    }
    return "rgba(" + stops[stops.length - 1][1].join(",") + "," + a + ")";
  }

  // ---------- engine geometry in engine units (x: 0..100 along the axis, r: radius 0..50)
  const CORE = [ // x, outer radius, inner radius of the core gas path, station temperature key
    [19, 18, 9, "Tt21"], [28, 15.5, 10, "Tt21"], [32, 13.5, 9.5, "Tt25"], [48, 9.5, 7.5, "Tt3"], [49, 12.5, 7, "T4"],
    [56, 12.5, 7, "T4"], [60, 11.5, 7.5, "T45"], [62, 12.5, 8, "T45"], [72, 15, 9, "Tt5"], [80, 12, 6, "Tt5"], [86, 10, 0.5, "Tt5"]];
  const STAGES = [ // x, hub r, tip r, spool, kind
    [21.5, 9.8, 16.8, "lp", "LPC"], [24.5, 10, 16.2, "lp", "LPC"], [27, 10, 15.6, "lp", "LPC"],
    [33, 9.4, 13.2, "hp", "HPC"], [35, 9.2, 12.6, "hp", "HPC"], [37, 9, 12], [39, 8.6, 11.4, "hp", "HPC"], [41, 8.3, 10.9, "hp", "HPC"],
    [43, 8.0, 10.4, "hp", "HPC"], [45, 7.8, 10.0, "hp", "HPC"], [47, 7.6, 9.7, "hp", "HPC"],
    [57.5, 7.3, 12.2, "hp", "HPT"], [59.5, 7.6, 11.6, "hp", "HPT"],
    [63.5, 8.2, 13.0, "lp", "LPT"], [66, 8.5, 13.8, "lp", "LPT"], [68.5, 8.7, 14.4, "lp", "LPT"], [71, 8.9, 14.9, "lp", "LPT"]];
  STAGES[5] = [37, 9.0, 12.0, "hp", "HPC"];

  function coreAt(x) {                 // interpolate the core gas-path radii at x
    for (let i = 1; i < CORE.length; i++) {
      if (x <= CORE[i][0]) {
        const a = CORE[i - 1], b = CORE[i], f = (x - a[0]) / (b[0] - a[0]);
        return [a[1] + f * (b[1] - a[1]), a[2] + f * (b[2] - a[2])];
      }
    }
    return [CORE[CORE.length - 1][1], CORE[CORE.length - 1][2]];
  }
  function cowlOuter(x) {              // core cowl = inner wall of the bypass duct
    if (x < 19) return null;
    if (x < 23) return 18 + (x - 19) * 0.9;
    if (x < 50) return 21.6 - (x - 23) * 0.06;
    if (x < 76) return 20 - (x - 50) * 0.27;
    return 13;
  }
  function nacelleInner(x, gap) {      // inner wall of the nacelle (fan duct); trailing edge set by the nozzle gap
    if (x < 13) return 41 + (13 - x) * 0.25;
    const te = cowlOuter(50) + gap;
    if (x < 30) return 41;
    if (x <= 50) return 41 + (te - 41) * ((x - 30) / 20);
    return te;
  }
  function nacelleOuter(x) {
    if (x < 3) return 43 + x;
    if (x < 16) return 46 + (x - 3) * 0.23;
    return 49 - (x - 16) * (49 - 41) / 34;
  }

  function stationT(d, x) {            // temperature along the core and bypass paths
    const pts = [[0, d.Tt2], [12, d.Tt2], [19, d.Tt21], [28, d.Tt25], [48, d.Tt3], [50, d.Tt3], [53, d.T4], [57, d.T4],
                 [61, d.T45], [72, d.Tt5], [86, d.Tt5], [100, 0.5 * (d.Tt5 + d.Tt2)], [130, d.Tt2]];
    for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
      const f = (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]); return pts[i - 1][1] + f * (pts[i][1] - pts[i - 1][1]);
    }
    return d.Tt2;
  }

  // ---------- particles (air parcels): s = position along the path [0..1], u = lateral position in the stream [0..1]
  function spawn(stream) { return { s: Math.random(), u: Math.random(), stream: stream, sp: 0.8 + 0.4 * Math.random() }; }
  function ensureParticles() { if (S.parts.length) return; for (let i = 0; i < 260; i++) S.parts.push(spawn("byp")); for (let i = 0; i < 140; i++) S.parts.push(spawn("core")); }

  function bypPos(p, d, gap) {         // bypass stream: inlet -> fan -> duct -> nozzle -> plume
    const x = -6 + p.s * (50 + 6 + plumeLen(d, "byp"));
    let rin, rout;
    if (x < 19) { rin = x < 11 ? 4 + Math.max(0, x) * 0.5 : 9 + (x - 11); rout = x < 0 ? 40 : nacelleInner(Math.max(x, 0), gap) - 0.5; rin = Math.max(rin, 0); if (x < 19) rin = Math.max(rin, 17 * (x - 8) / 11); }
    else if (x <= 50) { rin = cowlOuter(x) + 0.5; rout = nacelleInner(x, gap) - 0.5; }
    else { const k = (x - 50) / plumeLen(d, "byp"); rin = cowlOuter(Math.min(x, 76)) + 0.3; rout = rin + gap * (1 + 0.6 * k); }
    if (x < 19 && x > 8) { rin = Math.max(18 * (x - 8) / 11, 0); }
    return [x, rin + p.u * Math.max(rout - rin, 0.5)];
  }
  function corePos(p, d) {             // core stream: inlet (inner part) -> fan root -> LPC ... -> core nozzle -> plume
    const xend = 86 + plumeLen(d, "core");
    const x = -6 + p.s * (xend + 6);
    let rin, rout;
    if (x < 19) { rout = Math.min(17, 10 + Math.max(x, 0) * 0.4); rin = x < 4 ? 1 : Math.min(9, 1 + (x - 4)); }
    else if (x <= 86) { const c = coreAt(x); rout = c[0] - 0.3; rin = c[1] + 0.3; }
    else { const k = (x - 86) / plumeLen(d, "core"); rin = 0; rout = 10 * (1 + 0.5 * k); }
    return [x, rin + p.u * Math.max(rout - rin, 0.3)];
  }
  function plumeLen(d, which) {        // plume length ~ jet velocity (gross thrust per unit mass flow)
    if (which === "byp") { const v = d.W_byp > 1 ? d.Fg_byp / d.W_byp : 0; return 6 + Math.min(32, v * 0.9); }
    const v = d.W5 > 0.5 ? d.Fg_core / d.W5 : 0; return 5 + Math.min(28, v * 0.45);
  }

  // ---------- drawing
  function draw(cv, ctx, d, dt) {
    const W = cv.width, H = cv.height, dpr = window.devicePixelRatio || 1;
    const sx = W / 128, sy = (H * 0.40) / 50, x0 = W * 0.02, cy = H * 0.52;
    const X = (x) => x0 + (x + 6) * sx;
    const Yt = (r) => cy - r * sy, Yb = (r) => cy + r * sy;
    const gap = 3 + 8 * Math.max(0, Math.min(1, (d.VAFN - 2400) / (8000 - 2400)));
    ctx.clearRect(0, 0, W, H);
    const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#eef3f8"); sky.addColorStop(1, "#f7f7f4");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // centre line
    ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.setLineDash([6 * dpr, 6 * dpr]); ctx.beginPath(); ctx.moveTo(X(-6), cy); ctx.lineTo(X(122), cy); ctx.stroke(); ctx.setLineDash([]);

    // plumes (behind everything)
    const pb = plumeLen(d, "byp"), pc = plumeLen(d, "core");
    for (const s of [1, -1]) {
      const Y = s > 0 ? Yt : Yb;
      let g = ctx.createLinearGradient(X(50), 0, X(50 + pb), 0);
      g.addColorStop(0, tempColor(d.Tt21, 0.45)); g.addColorStop(1, tempColor(d.Tt21, 0));
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(X(50), Y(cowlOuter(50))); ctx.lineTo(X(50), Y(cowlOuter(50) + gap)); ctx.lineTo(X(50 + pb), Y(cowlOuter(50) + gap * 1.7));
      ctx.lineTo(X(50 + pb), Y(Math.max(0, cowlOuter(76) - 2))); ctx.closePath(); ctx.fill();
      g = ctx.createLinearGradient(X(86), 0, X(86 + pc), 0);
      g.addColorStop(0, tempColor(d.Tt5, 0.75)); g.addColorStop(1, tempColor(d.Tt5, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(X(84), Y(10.5)); ctx.lineTo(X(86 + pc), Y(15)); ctx.lineTo(X(86 + pc), cy); ctx.lineTo(X(84), cy); ctx.closePath(); ctx.fill();
    }

    // core gas path filled with the temperature field (gradient along x)
    const gcore = ctx.createLinearGradient(X(19), 0, X(86), 0);
    for (let x = 19; x <= 86; x += 3) gcore.addColorStop((x - 19) / 67, tempColor(stationT(d, x), 0.85));
    for (const s of [1, -1]) {
      const Y = s > 0 ? Yt : Yb;
      ctx.fillStyle = gcore; ctx.beginPath();
      for (let x = 19; x <= 86; x += 1) { const c = coreAt(x); ctx.lineTo(X(x), Y(c[0])); }
      for (let x = 86; x >= 19; x -= 1) { const c = coreAt(x); ctx.lineTo(X(x), Y(c[1])); }
      ctx.closePath(); ctx.fill();
      // bypass duct air
      const gb = ctx.createLinearGradient(X(12), 0, X(50), 0);
      gb.addColorStop(0, tempColor(d.Tt2, 0.35)); gb.addColorStop(1, tempColor(d.Tt21, 0.35));
      ctx.fillStyle = gb; ctx.beginPath();
      for (let x = 19; x <= 50; x += 1) ctx.lineTo(X(x), Y(cowlOuter(x)));
      for (let x = 50; x >= 19; x -= 1) ctx.lineTo(X(x), Y(nacelleInner(x, gap)));
      ctx.closePath(); ctx.fill();
    }

    // combustion flame
    const wfn = Math.max(0, Math.min(1.4, d.Wf / 1.4));
    S.flick += dt * 18;
    for (const s of [1, -1]) {
      const Y = s > 0 ? Yt : Yb;
      const fl = 0.85 + 0.15 * Math.sin(S.flick) * Math.sin(S.flick * 0.37 + s);
      const cx = X(51 + 2.5 * wfn), cyy = Y(10);
      const rad = (2.5 + 5 * wfn * fl) * sx;
      const g = ctx.createRadialGradient(cx, cyy, 0, cx, cyy, rad);
      g.addColorStop(0, "rgba(255,255,220," + (0.6 + 0.4 * wfn) + ")"); g.addColorStop(0.35, "rgba(255,190,60,0.85)");
      g.addColorStop(0.7, "rgba(240,90,20,0.55)"); g.addColorStop(1, "rgba(200,40,10,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cyy, rad, rad * 0.45, 0, 0, 2 * Math.PI); ctx.fill();
      // fuel injector
      ctx.fillStyle = "#555"; ctx.fillRect(X(48.6), Y(13.6), 1.2 * sx, (s > 0 ? 1 : -1) * 1.8 * sy);
    }

    // particles
    ensureParticles();
    const fbyp = Math.max(0.05, Math.min(1, d.W_byp / 1650)), fcore = Math.max(0.05, Math.min(1, d.W_core / 70));
    for (const p of S.parts) {
      const frac = p.stream === "byp" ? fbyp : fcore;
      if (S.cur.running) {
        const speed = (p.stream === "byp" ? 0.10 : 0.075) * (0.25 + 0.75 * frac) * p.sp;
        p.s += speed * dt;
        if (p.s > 1) { p.s -= 1; p.u = Math.random(); }
      }
      const idx = S.parts.indexOf(p);
      const nAct = p.stream === "byp" ? 260 * frac : 140 * frac;
      if ((p.stream === "byp" ? idx : idx - 260) > nAct) continue;
      const pos = p.stream === "byp" ? bypPos(p, d, gap) : corePos(p, d);
      const T = p.stream === "byp" ? (pos[0] < 12 ? d.Tt2 : d.Tt21) : stationT(d, pos[0]);
      const fade = pos[0] > (p.stream === "byp" ? 50 : 86) ? Math.max(0, 1 - (pos[0] - (p.stream === "byp" ? 50 : 86)) / (p.stream === "byp" ? pb : pc)) : 1;
      ctx.fillStyle = tempColor(T, 0.9 * fade);
      const r = (p.stream === "byp" ? 1.6 : 1.4) * dpr;
      for (const s of [1, -1]) {
        const y = s > 0 ? Yt(pos[1]) : Yb(pos[1]);
        ctx.beginPath(); ctx.arc(X(pos[0]), y, r, 0, 2 * Math.PI); ctx.fill();
      }
    }
    // VBV bleed: parcels jumping from the core to the bypass duct
    if (d.VBV > 0.02 && d.W_vbv > 0.1) {
      const n = Math.round(4 + 10 * d.VBV);
      for (let k = 0; k < n; k++) {
        const f = ((S.flick * 0.05 + k / n) % 1);
        ctx.fillStyle = tempColor(d.Tt25, 0.9 * (1 - f));
        for (const s of [1, -1]) {
          const y = (s > 0 ? Yt : Yb)(16 + f * 6); ctx.beginPath(); ctx.arc(X(29 + f * 2), y, 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
        }
      }
    }

    // walls: nacelle, core cowl, hub/plug
    function wall(pathTop, fill) {
      for (const s of [1, -1]) {
        const Y = s > 0 ? Yt : Yb; ctx.beginPath(); pathTop(Y); ctx.closePath();
        ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = "rgba(40,40,40,0.55)"; ctx.lineWidth = 1 * dpr; ctx.stroke();
      }
    }
    const metal = (x1, x2) => { const g = ctx.createLinearGradient(0, Yt(50), 0, cy); g.addColorStop(0, "#c9ced6"); g.addColorStop(0.5, "#eef0f3"); g.addColorStop(1, "#9aa1ab"); return g; };
    wall((Y) => { for (let x = 0; x <= 50; x += 1) ctx.lineTo(X(x), Y(nacelleOuter(x))); for (let x = 50; x >= 0; x -= 1) ctx.lineTo(X(x), Y(nacelleInner(x, gap))); }, metal());
    wall((Y) => { for (let x = 19; x <= 78; x += 1) ctx.lineTo(X(x), Y(Math.min(cowlOuter(x), 30))); for (let x = 78; x >= 19; x -= 1) ctx.lineTo(X(x), Y(Math.max(coreAt(x)[0], 0))); }, "#d7dbe1");
    wall((Y) => { ctx.moveTo(X(-1), Y(0)); ctx.quadraticCurveTo(X(2), Y(6), X(9), Y(8)); for (let x = 9; x <= 19; x += 1) ctx.lineTo(X(x), Y(Math.min(9, 8 + (x - 9) * 0.1)));
                  for (let x = 19; x <= 86; x += 1) ctx.lineTo(X(x), Y(coreAt(x)[1])); ctx.lineTo(X(92), Y(0)); }, "#b9bfc8");
    // VAFN: movable nozzle lip
    ctx.fillStyle = "#6c7480";
    for (const s of [1, -1]) { const Y = s > 0 ? Yt : Yb; ctx.fillRect(X(47.5), Y(cowlOuter(50) + gap + 2.5), 2.5 * sx, (s > 0 ? 1 : -1) * 2.5 * sy); }
    // VBV door
    ctx.strokeStyle = "#444"; ctx.lineWidth = 2.5 * dpr;
    for (const s of [1, -1]) {
      const Y = s > 0 ? Yt : Yb, a = d.VBV * 0.9;
      ctx.beginPath(); ctx.moveTo(X(28.5), Y(18.2)); ctx.lineTo(X(28.5 + 3 * Math.cos(a)), Y(18.2 + 3 * Math.sin(a))); ctx.stroke();
    }

    // shafts with moving stripes
    function shaft(x1, x2, r1, r2, ang, col) {
      for (const s of [1, -1]) {
        const Y = s > 0 ? Yt : Yb;
        ctx.fillStyle = col; ctx.fillRect(X(x1), Y(r2), (x2 - x1) * sx, (r2 - r1) * sy * (s > 0 ? 1 : -1));
        ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 1.5 * dpr;
        const pitch = 2.2, off = ((ang / (2 * Math.PI)) * pitch * 3) % pitch;
        for (let x = x1 + off; x < x2; x += pitch) { ctx.beginPath(); ctx.moveTo(X(x), Y(r1)); ctx.lineTo(X(x + 0.6), Y(r2)); ctx.stroke(); }
      }
    }
    shaft(14, 72, 0.4, 2.2, S.ang.lp, "#2a78d6");
    shaft(31, 61, 3.4, 5.4, S.ang.hp, "#eb6834");
    // gearbox
    for (const s of [1, -1]) { const Y = s > 0 ? Yt : Yb; ctx.fillStyle = "#7f8792"; ctx.fillRect(X(13.5), Y(7.5), 4 * sx, 7 * sy * (s > 0 ? 1 : -1)); }

    // rotating blade rows: blade k at angle a projects to radius r cos(a); sin(a) gives depth (front brighter)
    function bladeRow(x, rh, rt, n, ang, color, chord, wear) {
      const items = [];
      for (let k = 0; k < n; k++) { const a = ang + 2 * Math.PI * k / n; items.push([Math.sin(a), Math.cos(a)]); }
      items.sort((p, q) => p[0] - q[0]);
      for (const [dep, c] of items) {
        const r0 = rh * Math.abs(c), r1 = rt * Math.abs(c);
        if (Math.abs(c) < 0.06) continue;
        const Y = c > 0 ? Yt : Yb, lean = chord * 0.5 * dep;
        const shade = 0.45 + 0.55 * (dep + 1) / 2;
        ctx.fillStyle = wear > 0 ? "rgba(" + Math.round(150 * shade + 60) + "," + Math.round(90 * shade + 30) + "," + Math.round(60 * shade) + ",0.95)"
                                 : color.replace("A", shade.toFixed(2));
        ctx.beginPath(); ctx.moveTo(X(x - chord / 2 - lean * 0.3), Y(r0)); ctx.lineTo(X(x + chord / 2 - lean * 0.3), Y(r0));
        ctx.lineTo(X(x + chord / 2 + lean), Y(r1)); ctx.lineTo(X(x - chord / 2 + lean), Y(r1)); ctx.closePath(); ctx.fill();
      }
    }
    const H_ = d.health || {};
    const wearOf = (c) => (H_[c + "_eff"] || 0) + (H_[c + "_flow"] || 0);
    // fan disc (dark behind the blades)
    for (const s of [1, -1]) { const Y = s > 0 ? Yt : Yb; ctx.fillStyle = "rgba(60,70,85,0.12)"; ctx.fillRect(X(9.5), Y(40.5), 3.5 * sx, 40.5 * sy * (s > 0 ? 1 : -1)); }
    bladeRow(11.2, 8, 40.3, 22, S.ang.fan, "rgba(70,95,140,A)", 2.6, wearOf("fan"));
    for (const st of STAGES) {
      const [x, rh, rt, spool, kind] = st;
      const col = spool === "lp" ? "rgba(42,120,214,A)" : "rgba(235,104,52,A)";
      bladeRow(x, rh, rt, kind === "HPC" ? 16 : 12, spool === "lp" ? S.ang.lp : S.ang.hp, col, 1.1, wearOf(kind.toLowerCase()));
      // stator vanes (fixed)
      ctx.strokeStyle = "rgba(90,90,90,0.55)"; ctx.lineWidth = 1 * dpr;
      for (const s of [1, -1]) { const Y = s > 0 ? Yt : Yb; ctx.beginPath(); ctx.moveTo(X(x + 1.2), Y(rh)); ctx.lineTo(X(x + 1.0), Y(rt)); ctx.stroke(); }
    }
    // spinner
    ctx.fillStyle = "#8f97a3"; ctx.beginPath(); ctx.moveTo(X(-1), cy); ctx.quadraticCurveTo(X(3), Yt(7.5), X(9.5), Yt(8)); ctx.lineTo(X(9.5), Yb(8)); ctx.quadraticCurveTo(X(3), Yb(7.5), X(-1), cy); ctx.fill();

    // labels with live values
